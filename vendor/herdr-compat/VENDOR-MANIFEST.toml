[local_adaptations]
api_client = "Concrete socket paths and timeout/event helpers; no Herdr session ownership."
api_status = "Retains only RuntimeStatus consumed by bridge admission."
schema_tabs_workspaces = "Keeps optional clear-name sentinel labels for bridge rename behavior."
input = "Keeps only wire-required input model types."
raw_input = "Keeps only RawInputEvent types required by the copied protocol."
ipc = "Keeps connect-only local socket helper; bridge owns listeners and teardown."
logging = "Accepts a bridge-owned log directory instead of Herdr session state."
popup_size = "Makes PopupSize public for copied schema types."
socket_paths = "Derives from supplied overrides/defaults; bridge owns session resolution."
schema_tests = "Removes upstream generated API-schema artifact test unavailable in this narrow crate."
